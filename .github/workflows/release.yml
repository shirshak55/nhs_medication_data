name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    release:
        runs-on: macos-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install deps
              run: bun install

            - name: Build native executables
              run: bun run build:exe

            - name: Run scraper (produces output.json)
              run: bun start

            - name: Ensure output.json exists
              run: test -f output.json

            - name: Tag
              id: vars
              run: |
                  echo "version=$(date +'%Y-%m-%d')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.vars.outputs.version }}
                  name: ${{ steps.vars.outputs.version }}
                  files: |
                      build/*
                      output.json
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
